AnalysisType: rule
Filename: aws_console_root_login.py
RuleID: "POC.AWS.Console.RootLogin"
DisplayName: "Root Console Login"
Enabled: true
Severity: High
# Threshold 1 (the default): the first match alerts immediately.
DedupPeriodMinutes: 60
LogTypes:
  - AWS.CloudTrail
Description: The AWS root account was used to sign in to the console.
Runbook: >
  Confirm the login was authorised. If it was not, rotate the root credentials,
  enable MFA on the root user, and review what the session did.
Reference: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
Tags:
  - AWS
  - Authentication
