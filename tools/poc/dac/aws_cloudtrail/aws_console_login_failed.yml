AnalysisType: rule
Filename: aws_console_login_failed.py
RuleID: "POC.AWS.Console.LoginFailed"
DisplayName: "Repeated Failed Console Logins"
Enabled: true
Severity: Medium
# The interesting knob in this bundle: a single failed login is noise, so a
# SIGNAL is written on every match but no ALERT is raised until 3 matches share
# a dedup string inside the window. Proves signal-vs-alert in the demo.
Threshold: 3
DedupPeriodMinutes: 60
LogTypes:
  - AWS.CloudTrail
Description: Three or more failed console sign-ins for the same principal.
Runbook: >
  Check whether the source IP is expected for this user. Repeated failures from
  an unfamiliar IP suggest credential stuffing.
Tags:
  - AWS
  - Authentication
