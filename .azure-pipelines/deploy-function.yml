# Deploy the pyre Function App. Push to main -> live.
#
# This pipeline is intended to be the ONLY thing that writes to the Function App
# resource. That is an access-control property as much as a pipeline one - see
# docs/poc/continuous-deployment.md for the rest of what "sole contributor"
# requires (RBAC, disabling SCM basic auth, and who owns app settings).
#
# Wire up in ADO: Pipelines -> New pipeline -> this repo -> "Existing Azure
# Pipelines YAML file" -> /.azure-pipelines/deploy-function.yml
#
# Required variable group `pyre-<env>` (Pipelines -> Library):
#   AZURE_SERVICE_CONNECTION   ARM service connection name
#   RESOURCE_GROUP             the function app's resource group
#   FUNCTION_APP               e.g. pyre
#   STORAGE_ACCOUNT            the storage account name (no URL)
#   EVENTHUB_NAME              the hub the POC reads
# Anything else referenced as ${...} in config/appsettings/<env>.json goes here too.

trigger:
  branches:
    include: [main]
  paths:
    # Detections are NOT in this repo and hot-reload from Blob, so they never
    # need a deploy. Docs don't either. Keeping this list tight is what stops a
    # README typo restarting the detection engine.
    include:
      - engine/**
      - config/**
      - tools/poc/package_function.py
      - .azure-pipelines/deploy-function.yml

pr: none

# One deploy at a time. Two overlapping runs would race on the same resource and
# leave you unsure which commit is actually live.
lockBehavior: sequential

pool:
  vmImage: ubuntu-latest

variables:
  - group: pyre-poc
  - name: ENV_NAME
    value: poc

stages:
  - stage: verify
    displayName: Verify
    jobs:
      - job: tests
        displayName: Tests + bundle validation
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: "3.11" }

          - script: pip install -r engine/requirements.txt pytest fakeredis
            displayName: Install

          # Includes the backend-parity test: the in-process state backend and
          # the real Redis code path must produce identical signals and alerts.
          # A change that breaks the POC/production seam fails HERE, not later.
          - script: python -m pytest tests -q
            displayName: pytest

          - script: python tools/poc/package_function.py --stage
            displayName: Stage the function app root

          - publish: dist/functionapp
            artifact: functionapp
            displayName: Publish artifact

  - stage: deploy
    displayName: Deploy
    dependsOn: verify
    condition: succeeded()
    jobs:
      - deployment: deploy_function
        displayName: Deploy to $(FUNCTION_APP)
        # An ADO Environment gives you the deployment history and, if you want
        # one, an approval gate. Remove `environment:` for a plain job.
        environment: pyre-$(ENV_NAME)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: functionapp

                # 1. Configuration first. Settings changes restart the app, so
                #    applying them BEFORE the code means one restart, not two,
                #    and the new code never starts under the old settings.
                - task: AzureCLI@2
                  displayName: Apply app settings from the repo
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      python tools/poc/apply_settings.py \
                        --env "$(ENV_NAME)" \
                        -g "$(RESOURCE_GROUP)" -n "$(FUNCTION_APP)" \
                        --var STORAGE_ACCOUNT="$(STORAGE_ACCOUNT)" \
                        --var EVENTHUB_NAME="$(EVENTHUB_NAME)"

                # 2. The code. Authenticates through the service connection's
                #    identity, not SCM basic auth - so this works in tenants
                #    where basic auth is disabled by policy.
                - task: AzureFunctionApp@2
                  displayName: Deploy code
                  inputs:
                    connectedServiceNameARM: $(AZURE_SERVICE_CONNECTION)
                    appType: functionAppLinux
                    appName: $(FUNCTION_APP)
                    package: $(Pipeline.Workspace)/functionapp
                    runtimeStack: "PYTHON|3.11"
                    deploymentMethod: zipDeploy

                # 3. Prove it actually came up. Without this a broken bundle or a
                #    wrong LOG_TYPE_FIELD deploys "successfully" and detection is
                #    silently down until someone notices no alerts.
                - task: AzureCLI@2
                  displayName: Health gate
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      KEY=$(az functionapp function keys list \
                        -g "$(RESOURCE_GROUP)" -n "$(FUNCTION_APP)" \
                        --function-name health --query default -o tsv)
                      URL="https://$(FUNCTION_APP).azurewebsites.net/api/health?code=$KEY"

                      # Cold start plus bundle download; give it a minute.
                      for i in $(seq 1 12); do
                        BODY=$(curl -sS --max-time 20 "$URL" || true)
                        CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
                        [ "$CODE" = "200" ] && break
                        echo "attempt $i: HTTP $CODE"
                        sleep 10
                      done

                      echo "$BODY"
                      [ "$CODE" = "200" ] || { echo "##vso[task.logissue type=error]health check failed"; exit 1; }

                      # 200 with zero detections means the engine is up but blind.
                      DETECTIONS=$(echo "$BODY" | python -c 'import json,sys; print(json.load(sys.stdin).get("detections",0))')
                      if [ "$DETECTIONS" -eq 0 ]; then
                        echo "##vso[task.logissue type=error]app is healthy but loaded 0 detections"
                        exit 1
                      fi
                      echo "healthy: $DETECTIONS detection(s) loaded"
