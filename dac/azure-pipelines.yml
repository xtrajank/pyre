# Push a detection to main -> the bundle is rebuilt and published to Blob ->
# running workers reload it within DETECTIONS_REFRESH_SECONDS. Nothing is
# redeployed.
#
# SETUP (once, in Azure DevOps):
#   1. Pipelines -> New -> Azure Repos Git -> this repo -> Existing YAML file
#   2. Create one Azure Resource Manager service connection per pyre instance
#      you publish to (Project settings -> Service connections).
#   3. Give each service connection's identity the role
#      `Storage Blob Data Contributor` on that instance's storage account.
#   4. Edit the publish stages below with those names and account URLs.
#   5. For any instance that should be a decision rather than a push, create a
#      Pipelines -> Environments entry with an approval check and name it in
#      that stage's `environment:`.
#
# ADDING AN INSTANCE is one more `- template:` block.

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: validate
    jobs:
      - job: validate
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: "3.11" }
          - script: pip install pyyaml pytest
            displayName: install
          # Build without --upload: this validates every detection and fails the
          # push if a bundle would load nothing. Cheap, and it runs before any
          # instance sees the change.
          - script: python publish.py
            displayName: validate + build bundle
          # Detection unit tests, if you have any (tests/ is excluded from the
          # bundle, so it never ships to the engine).
          - script: |
              if [ -d tests ]; then pytest tests -q; else echo "no tests/ - skipping"; fi
            displayName: detection tests

  # --- one block per instance ------------------------------------------------
  - template: azure-pipelines-publish.yml
    parameters:
      instance: staging
      azureSubscription: <staging-service-connection>
      accountUrl: https://<staging-account>.blob.core.windows.net
      dependsOn: [validate]

  - template: azure-pipelines-publish.yml
    parameters:
      instance: production
      azureSubscription: <production-service-connection>
      accountUrl: https://<production-account>.blob.core.windows.net
      environment: production
      dependsOn: [publish_staging]
