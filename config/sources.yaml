# Every log source pyre ingests, grouped by Event Hubs namespace. Any number of
# namespaces, any number of hubs per namespace - there is no code to change and
# no limit.
#
# Only `namespace:` and `hub:` are required. Everything else defaults to the
# shape Azure diagnostic settings emit, which is what streams out of any Azure
# resource:
#
#   consumer_group:    $Default
#   log_type_field:    category              THE field that selects detections
#   event_time_field:  time                  the record's own timestamp
#   envelope_field:    records               array field when one message holds many
#
# log_type_field is the one to get right. Its value on each record must equal a
# detection's `LogTypes:` entry EXACTLY - it is case-sensitive, and a mismatch
# looks exactly like "the engine isn't working". Check yours in the portal:
# Event Hubs Namespace -> your hub -> Data Explorer -> View events -> Body.
#
# `namespace:` is a short label, not a resource name - it becomes both the
# app-setting group the trigger authenticates with (EVENTHUB_<NAMESPACE>) and
# part of the Azure function name, so it only has to be unique WITHIN this
# file. Every hub listed under one namespace shares that one connection; there
# is no per-hub connection field to type (or mistype) at all. See
# docs/adding-a-log-source.md for the full add-a-namespace runbook, including
# the app settings and RBAC each one needs - never a connection string.
#
# Two functions reading the same hub (e.g. someone else already consumes
# $Default) need different `consumer_group:` values, or the second entry will
# be rejected as a duplicate function name.

namespaces:
  # The POC's namespace. Azure diagnostic logs about the Event Hub namespace
  # itself, so the hubs feed themselves and you can demo without any external
  # log source. App setting: EVENTHUB_PYRE_EVNTHUB.
  - namespace: pyre-evnthub
    hubs:
      - hub: applog
        log_type_field: category
        event_time_field: time
        envelope_field: records

      - hub: storageacct
        log_type_field: category
        event_time_field: time
        envelope_field: records

  # More namespaces look like this. Delete or edit as you onboard real feeds -
  # copy-paste the whole block, including docs/adding-a-log-source.md's app
  # setting and RBAC steps for whatever `namespace:` you choose.
  #
  # - namespace: network
  #   fully_qualified_namespace: netns.servicebus.windows.net   # optional; checked by /health
  #   hubs:
  #     - hub: palo-traffic-in
  #       log_type_field: dataset          # a normalizer's own field
  #       event_time_field: _time
  #       envelope_field: ""               # one message = one record
  #
  #     - hub: insights-logs-signinlogs
  #       log_type_field: category
  #       event_time_field: time
