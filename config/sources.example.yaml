# Every log source pyre ingests, grouped by Event Hubs namespace.
#
# Copy this file to config/sources.yaml and edit it. sources.yaml is gitignored
# because it describes your infrastructure; this example is the template that
# stays in the repo. The app reads sources.yaml only - it will not start with
# sources.
#
# Only `namespace:` and `hub:` are required. Everything else defaults to the
# shape Azure diagnostic settings emit, which is what streams out of any Azure
# resource:
#
#   consumer_group:    $Default
#   log_type_field:    category      THE field that selects detections
#   event_time_field:  time          the record's own timestamp
#   envelope_field:    records       array field when one message holds many
#
# log_type_field is the one to get right: its value on each record must equal a
# detection's `LogTypes:` entry EXACTLY (case-sensitive). A mismatch looks
# exactly like "the engine isn't working" - /health lists every log type that
# actually loaded, and the batch log line reports unrouted values by name.
#
# `namespace:` is a short label you choose, not a resource name. It becomes the
# app-setting group the trigger authenticates with (EVENTHUB_<NAMESPACE>) and
# part of the Azure function name, so it only has to be unique within this file.
#
# See docs/adding-a-log-source.md for the full runbook, including the app
# settings and RBAC each namespace needs - never a connection string.

namespaces:
  - namespace: platform
    # Optional. Only /health checks it, against the namespace's app setting.
    fully_qualified_namespace: <namespace>.servicebus.windows.net
    hubs:
      # Azure diagnostic logs: the defaults already match, so a hub name is all
      # this needs.
      - hub: insights-logs-signinlogs

      - hub: insights-metrics-pt1m

  - namespace: network
    hubs:
      # A source a normalizer writes: its own routing field, its own timestamp,
      # and one message per record rather than an envelope.
      - hub: firewall-traffic
        log_type_field: dataset
        event_time_field: _time
        envelope_field: ""

      # Two functions reading the SAME hub need different consumer groups, or
      # the second entry is rejected as a duplicate function name.
      - hub: firewall-traffic
        consumer_group: pyre-secondary
        log_type_field: dataset
        event_time_field: _time
        envelope_field: ""
