# Declarative alert destinations. Add an INSTANCE here; add a new KIND only by
# adding an adapter in engine/pyre_engine/dispatch.py. Secrets come from
# Key Vault via *_env references, never inline.

destinations:
  # POC sink. Appends each delivered alert as a JSON line to
  # <OUTPUT_BLOB_CONTAINER>/alerts/<UTC date>.jsonl - no external service needed.
  # The engine also registers this destination automatically whenever
  # OUTPUT_BLOB_ACCOUNT_URL is set, so the POC function package ships no config
  # files at all; this entry is here so a local run behaves identically.
  - name: blob_alerts
    kind: blob
    enabled: true

  - name: mock                 # test-lab sink
    kind: mock
    enabled: true
    url_env: MOCK_DEST_URL

  - name: torq_dev
    kind: torq
    enabled: true
    url_env: TORQ_DEV_URL
    token_env: TORQ_DEV_TOKEN   # Key Vault reference

  - name: torq_prod
    kind: torq
    enabled: false              # enabled in prod env config
    url_env: TORQ_PROD_URL
    token_env: TORQ_PROD_TOKEN
