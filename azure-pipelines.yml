# Deploy the engine from Azure DevOps. Optional - VS Code and the portal deploy
# the same thing - but this is the one that doesn't need anyone's laptop, and it
# is the answer to "our IP changed" and "who deployed this?".
#
# SETUP (once):
#   1. Push this repo to Azure Repos.
#   2. Pipelines -> New -> Azure Repos Git -> this repo -> Existing YAML file.
#   3. Project settings -> Service connections -> one Azure Resource Manager
#      connection per instance you deploy to.
#   4. Edit the deploy stages below to your instance names, service connections
#      and Function App names.
#   5. For any instance that should be a decision rather than a push, create a
#      Pipelines -> Environments entry, add an approval check to it, and name it
#      in that stage's `environment:`.
#
# ADDING AN INSTANCE is one more `- template:` block. Nothing else in the repo
# changes: what an instance DOES is entirely its App settings, not its code.
# See docs/deploying.md.
#
# The build agent has a fixed set of outbound IPs that are not your laptop's, so
# if the Function App restricts inbound access you either add the agent's range
# or use a self-hosted agent inside the network. See docs/troubleshooting.md.

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: test
    jobs:
      - job: test
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: "3.11" }
          - script: pip install -r requirements.txt -r requirements-dev.txt
            displayName: install
          - script: python -m pytest tests -q
            displayName: tests

  # --- one block per instance ------------------------------------------------
  # Deploys on every push to main.
  - template: azure-pipelines-deploy.yml
    parameters:
      instance: staging
      azureSubscription: <staging-service-connection>
      appName: <staging-function-app>
      dependsOn: [test]

  # Deploys only after the `production` environment's approval check passes.
  - template: azure-pipelines-deploy.yml
    parameters:
      instance: production
      azureSubscription: <production-service-connection>
      appName: <production-function-app>
      environment: production
      dependsOn: [deploy_staging]
